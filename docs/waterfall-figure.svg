<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 18px; fill: #4b5563; }
      .stage { rx: 10; filter: url(#shadow); }
      .stage-title { font-size: 24px; font-weight: 700; fill: #fff; }
      .stage-index { font-size: 16px; font-weight: 700; fill: #fff; opacity: .82; }
      .stage-body { font-size: 17px; fill: #1f2937; }
      .stage-note { font-size: 15px; fill: #6b7280; }
      .arrow { stroke: #374151; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .artifact { fill: #fff; stroke: #e5e7eb; stroke-width: 1.5; rx: 8; }
      .artifact-title { font-size: 17px; font-weight: 700; fill: #111827; }
      .artifact-text { font-size: 15px; fill: #4b5563; }
      .footer { font-size: 15px; fill: #6b7280; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity=".12"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43bfd8"/>
      <stop offset="100%" stop-color="#2e6f95"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303b78"/>
      <stop offset="100%" stop-color="#6f2ec4"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99b346"/>
      <stop offset="100%" stop-color="#16827b"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d89b2b"/>
      <stop offset="100%" stop-color="#d84840"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9155c"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1800" height="1240"/>
  <text x="900" y="68" text-anchor="middle" class="title">Phases of the Waterfall Software Development Model</text>
  <text x="900" y="102" text-anchor="middle" class="subtitle">Sequential software development process</text>

  <!-- Stage 1 -->
  <rect x="105" y="150" width="470" height="132" class="stage" fill="url(#g1)"/>
  <text x="135" y="190" class="stage-index">01</text>
  <text x="190" y="190" class="stage-title">Requirements Analysis</text>
  <rect x="135" y="215" width="410" height="148" class="artifact"/>
  <text x="160" y="250" class="artifact-title">Requirements definition</text>
  <text x="160" y="282" class="stage-body">• Identify stakeholder requirements</text>
  <text x="160" y="312" class="stage-body">• Define functional requirements</text>
  <text x="160" y="342" class="stage-body">• Define non-functional requirements</text>

  <!-- Stage 2 -->
  <path d="M575 265 C670 265 670 340 755 340" class="arrow"/>
  <rect x="755" y="280" width="470" height="132" class="stage" fill="url(#g2)"/>
  <text x="785" y="320" class="stage-index">02</text>
  <text x="840" y="320" class="stage-title">System Analysis</text>
  <rect x="785" y="345" width="410" height="148" class="artifact"/>
  <text x="810" y="380" class="artifact-title">System understanding</text>
  <text x="810" y="412" class="stage-body">• Analyse business processes</text>
  <text x="810" y="442" class="stage-body">• Identify system actors</text>
  <text x="810" y="472" class="stage-body">• Define system requirements</text>

  <!-- Stage 3 -->
  <path d="M1225 395 C1310 395 1270 470 1345 470" class="arrow"/>
  <rect x="1345" y="410" width="370" height="132" class="stage" fill="url(#g3)"/>
  <text x="1375" y="450" class="stage-index">03</text>
  <text x="1430" y="450" class="stage-title">Design</text>
  <rect x="1345" y="565" width="370" height="148" class="artifact"/>
  <text x="1370" y="600" class="artifact-title">Design specifications</text>
  <text x="1370" y="632" class="stage-body">• System architecture</text>
  <text x="1370" y="662" class="stage-body">• Database design</text>
  <text x="1370" y="692" class="stage-body">• User interface design</text>

  <!-- Stage 4 -->
  <path d="M1530 713 C1530 790 1335 792 1215 745" class="arrow"/>
  <rect x="745" y="650" width="470" height="132" class="stage" fill="url(#g4)"/>
  <text x="775" y="690" class="stage-index">04</text>
  <text x="830" y="690" class="stage-title">Implementation</text>
  <rect x="775" y="715" width="410" height="148" class="artifact"/>
  <text x="800" y="750" class="artifact-title">Software construction</text>
  <text x="800" y="782" class="stage-body">• Develop software modules</text>
  <text x="800" y="812" class="stage-body">• Integrate components</text>
  <text x="800" y="842" class="stage-body">• Perform unit testing</text>

  <!-- Stage 5 -->
  <path d="M745 765 C650 765 650 840 565 840" class="arrow"/>
  <rect x="95" y="800" width="470" height="132" class="stage" fill="url(#g5)"/>
  <text x="125" y="840" class="stage-index">05</text>
  <text x="180" y="840" class="stage-title">Testing</text>
  <rect x="125" y="865" width="410" height="148" class="artifact"/>
  <text x="150" y="900" class="artifact-title">Quality verification</text>
  <text x="150" y="932" class="stage-body">• Functional testing</text>
  <text x="150" y="962" class="stage-body">• Integration testing</text>
  <text x="150" y="992" class="stage-body">• System testing</text>

  <!-- Stage 6 -->
  <path d="M565 915 C725 915 725 990 875 990" class="arrow"/>
  <rect x="875" y="930" width="470" height="132" class="stage" fill="url(#g6)"/>
  <text x="905" y="970" class="stage-index">06</text>
  <text x="960" y="970" class="stage-title">Deployment and Maintenance</text>
  <rect x="905" y="995" width="410" height="148" class="artifact"/>
  <text x="930" y="1030" class="artifact-title">System operation</text>
  <text x="930" y="1062" class="stage-body">• Deploy the system</text>
  <text x="930" y="1092" class="stage-body">• Monitor performance</text>
  <text x="930" y="1122" class="stage-body">• Correct defects and enhancements</text>

  <!-- Caption -->
  <text x="900" y="1190" text-anchor="middle" class="footer">Figure 5.1. Phases of the Waterfall Software Development Model.</text>
  <text x="900" y="1214" text-anchor="middle" class="footer">Source: Adapted from Royce (1970) and Pressman &amp; Maxim (2020).</text>
</svg>
