<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240">
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 18px; fill: #4b5563; }
      .axis { stroke: #d1d5db; stroke-width: 2; stroke-dasharray: 8 8; }
      .spiral { fill: none; stroke: #111827; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .spiral-soft { fill: none; stroke: #d1d5db; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; opacity: .35; }
      .ring { fill: none; stroke: #e5e7eb; stroke-width: 2; }
      .quadrant { fill: #fff; stroke: #e5e7eb; stroke-width: 1.5; rx: 10; filter: url(#shadow); }
      .q-title { font-size: 23px; font-weight: 700; fill: #fff; }
      .q-index { font-size: 16px; font-weight: 700; fill: #fff; opacity: .82; }
      .q-body { font-size: 17px; fill: #1f2937; }
      .q-head { font-size: 17px; font-weight: 700; fill: #111827; }
      .caption { font-size: 15px; fill: #6b7280; }
      .label { font-size: 16px; font-weight: 700; fill: #4b5563; }
      .iteration { font-size: 15px; fill: #6b7280; }
      .badge-text { font-size: 15px; font-weight: 700; fill: #fff; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity=".12"/>
    </filter>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43bfd8"/>
      <stop offset="100%" stop-color="#2e6f95"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#303b78"/>
      <stop offset="100%" stop-color="#6f2ec4"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d89b2b"/>
      <stop offset="100%" stop-color="#d84840"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9155c"/>
      <stop offset="100%" stop-color="#7f8c8d"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1800" height="1240"/>
  <text x="900" y="68" text-anchor="middle" class="title">Spiral Software Development Model</text>
  <text x="900" y="102" text-anchor="middle" class="subtitle">Iterative and risk-driven software development process</text>

  <!-- Central spiral model -->
  <circle cx="900" cy="610" r="115" class="ring"/>
  <circle cx="900" cy="610" r="200" class="ring"/>
  <circle cx="900" cy="610" r="285" class="ring"/>
  <circle cx="900" cy="610" r="370" class="ring"/>
  <line x1="900" y1="210" x2="900" y2="1010" class="axis"/>
  <line x1="500" y1="610" x2="1300" y2="610" class="axis"/>

  <text x="900" y="192" text-anchor="middle" class="label">Planning</text>
  <text x="1324" y="616" class="label">Risk Analysis</text>
  <text x="900" y="1040" text-anchor="middle" class="label">Engineering</text>
  <text x="428" y="616" text-anchor="end" class="label">Customer Evaluation</text>

  <path class="spiral-soft" d="M900 610
    C944 566 1018 579 1030 646
    C1046 736 938 808 827 754
    C688 686 696 476 865 389
    C1079 278 1322 442 1297 689
    C1268 980 900 1110 630 920
    C306 692 390 176 806 165
    C1262 153 1555 632 1350 1048"/>
  <path class="spiral" d="M900 610
    C944 566 1018 579 1030 646
    C1046 736 938 808 827 754
    C688 686 696 476 865 389
    C1079 278 1322 442 1297 689
    C1268 980 900 1110 630 920
    C306 692 390 176 806 165
    C1262 153 1555 632 1350 1048"/>

  <circle cx="900" cy="610" r="28" fill="#111827"/>
  <text x="900" y="616" text-anchor="middle" class="badge-text">Start</text>
  <text x="1038" y="592" class="iteration">Iteration 1</text>
  <text x="715" y="458" class="iteration">Iteration 2</text>
  <text x="1212" y="804" class="iteration">Iteration 3</text>
  <text x="520" y="850" class="iteration">Subsequent Iterations</text>

  <!-- Phase cards -->
  <rect x="95" y="175" width="460" height="180" class="quadrant"/>
  <rect x="95" y="175" width="460" height="62" rx="10" fill="url(#g1)"/>
  <text x="125" y="214" class="q-index">01</text>
  <text x="180" y="214" class="q-title">Planning</text>
  <text x="125" y="270" class="q-body">• Define objectives</text>
  <text x="125" y="300" class="q-body">• Identify alternatives</text>
  <text x="125" y="330" class="q-body">• Identify constraints and assumptions</text>

  <rect x="1245" y="175" width="460" height="180" class="quadrant"/>
  <rect x="1245" y="175" width="460" height="62" rx="10" fill="url(#g2)"/>
  <text x="1275" y="214" class="q-index">02</text>
  <text x="1330" y="214" class="q-title">Risk Analysis</text>
  <text x="1275" y="270" class="q-body">• Identify project risks</text>
  <text x="1275" y="300" class="q-body">• Evaluate risk impact</text>
  <text x="1275" y="330" class="q-body">• Develop mitigation strategies</text>

  <rect x="1245" y="890" width="460" height="180" class="quadrant"/>
  <rect x="1245" y="890" width="460" height="62" rx="10" fill="url(#g3)"/>
  <text x="1275" y="929" class="q-index">03</text>
  <text x="1330" y="929" class="q-title">Engineering</text>
  <text x="1275" y="985" class="q-body">• Design the solution</text>
  <text x="1275" y="1015" class="q-body">• Develop software</text>
  <text x="1275" y="1045" class="q-body">• Perform verification and testing</text>

  <rect x="95" y="890" width="460" height="180" class="quadrant"/>
  <rect x="95" y="890" width="460" height="62" rx="10" fill="url(#g4)"/>
  <text x="125" y="929" class="q-index">04</text>
  <text x="180" y="929" class="q-title">Customer Evaluation</text>
  <text x="125" y="985" class="q-body">• Evaluate the developed increment</text>
  <text x="125" y="1015" class="q-body">• Gather stakeholder feedback</text>
  <text x="125" y="1045" class="q-body">• Plan the next iteration</text>

  <!-- Caption -->
  <text x="900" y="1190" text-anchor="middle" class="caption">Figure 5.2. Phases of the Spiral Software Development Model.</text>
  <text x="900" y="1214" text-anchor="middle" class="caption">Source: Adapted from Boehm (1988) and Pressman &amp; Maxim (2020).</text>
</svg>
