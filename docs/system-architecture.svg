<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">System Architecture Diagram</title>
  <desc id="desc">Architecture diagram for an e-commerce system using React, Node.js Express, Mongoose models, MongoDB, Socket.IO, Cloudinary, payment gateways, and email service.</desc>

  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #2f3a4a; stroke-width: 2; }
      .node-blue { fill: #eaf3ff; stroke: #2563eb; }
      .node-green { fill: #ecfdf3; stroke: #16a34a; }
      .node-orange { fill: #fff7ed; stroke: #ea580c; }
      .node-purple { fill: #f5f0ff; stroke: #7c3aed; }
      .node-gray { fill: #f8fafc; stroke: #475569; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #64748b; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .small { font: 400 12.5px Arial, sans-serif; fill: #334155; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .section { font: 700 15px Arial, sans-serif; fill: #334155; letter-spacing: .2px; }
      .arrow { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 7 5; }
      .socket-arrow { stroke: #7c3aed; stroke-width: 2.2; fill: none; marker-end: url(#arrow-purple); stroke-dasharray: 5 4; }
    </style>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="760"/>

  <text x="640" y="46" text-anchor="middle" class="title">System Architecture Diagram</text>
  <text x="640" y="72" text-anchor="middle" class="subtitle">E-commerce web application architecture</text>

  <rect x="40" y="110" width="205" height="560" rx="14" class="panel"/>
  <text x="142" y="140" text-anchor="middle" class="section">Client Layer</text>

  <rect x="68" y="176" width="148" height="82" rx="10" class="node node-blue"/>
  <text x="142" y="209" text-anchor="middle" class="label">Customer</text>
  <text x="142" y="231" text-anchor="middle" class="small">Browser</text>

  <rect x="68" y="306" width="148" height="82" rx="10" class="node node-blue"/>
  <text x="142" y="339" text-anchor="middle" class="label">Admin</text>
  <text x="142" y="361" text-anchor="middle" class="small">Browser</text>

  <rect x="68" y="500" width="148" height="96" rx="10" class="node node-purple"/>
  <text x="142" y="532" text-anchor="middle" class="label">Realtime UI</text>
  <text x="142" y="554" text-anchor="middle" class="small">Chat</text>
  <text x="142" y="574" text-anchor="middle" class="small">Notifications</text>

  <rect x="285" y="110" width="220" height="560" rx="14" class="panel"/>
  <text x="395" y="140" text-anchor="middle" class="section">Frontend Layer</text>

  <rect x="317" y="205" width="156" height="106" rx="10" class="node node-blue"/>
  <text x="395" y="240" text-anchor="middle" class="label">React Frontend</text>
  <text x="395" y="264" text-anchor="middle" class="small">Customer Pages</text>
  <text x="395" y="284" text-anchor="middle" class="small">Admin Dashboard</text>

  <rect x="317" y="380" width="156" height="106" rx="10" class="node node-gray"/>
  <text x="395" y="415" text-anchor="middle" class="label">API Client</text>
  <text x="395" y="439" text-anchor="middle" class="small">Axios Requests</text>
  <text x="395" y="459" text-anchor="middle" class="small">JWT Headers</text>

  <rect x="317" y="555" width="156" height="78" rx="10" class="node node-purple"/>
  <text x="395" y="587" text-anchor="middle" class="label">Socket.IO</text>
  <text x="395" y="610" text-anchor="middle" class="small">Client</text>

  <rect x="545" y="110" width="350" height="560" rx="14" class="panel"/>
  <text x="720" y="140" text-anchor="middle" class="section">Backend Layer</text>

  <rect x="625" y="168" width="190" height="60" rx="10" class="node node-green"/>
  <text x="720" y="193" text-anchor="middle" class="label">Node.js / Express</text>
  <text x="720" y="213" text-anchor="middle" class="small">REST API Server</text>

  <rect x="625" y="257" width="190" height="60" rx="10" class="node node-gray"/>
  <text x="720" y="282" text-anchor="middle" class="label">Middleware</text>
  <text x="720" y="302" text-anchor="middle" class="small">JWT / Admin Auth</text>

  <rect x="625" y="346" width="190" height="60" rx="10" class="node node-gray"/>
  <text x="720" y="371" text-anchor="middle" class="label">Routes</text>
  <text x="720" y="391" text-anchor="middle" class="small">API Endpoints</text>

  <rect x="625" y="435" width="190" height="60" rx="10" class="node node-gray"/>
  <text x="720" y="460" text-anchor="middle" class="label">Controllers</text>
  <text x="720" y="480" text-anchor="middle" class="small">Request Handling</text>

  <rect x="625" y="524" width="190" height="60" rx="10" class="node node-green"/>
  <text x="720" y="549" text-anchor="middle" class="label">Services</text>
  <text x="720" y="569" text-anchor="middle" class="small">Business Logic</text>

  <rect x="625" y="613" width="190" height="60" rx="10" class="node node-orange"/>
  <text x="720" y="638" text-anchor="middle" class="label">Models</text>
  <text x="720" y="658" text-anchor="middle" class="small">Mongoose Schemas</text>

  <rect x="950" y="110" width="290" height="560" rx="14" class="panel"/>
  <text x="1095" y="140" text-anchor="middle" class="section">Data and External Services</text>

  <rect x="992" y="185" width="206" height="105" rx="10" class="node node-orange"/>
  <text x="1095" y="219" text-anchor="middle" class="label">MongoDB</text>
  <text x="1095" y="243" text-anchor="middle" class="small">Users, Products</text>
  <text x="1095" y="263" text-anchor="middle" class="small">Orders, Inventory</text>

  <rect x="992" y="340" width="206" height="78" rx="10" class="node node-blue"/>
  <text x="1095" y="372" text-anchor="middle" class="label">Cloudinary</text>
  <text x="1095" y="395" text-anchor="middle" class="small">Image Storage</text>

  <rect x="992" y="475" width="206" height="78" rx="10" class="node node-purple"/>
  <text x="1095" y="507" text-anchor="middle" class="label">Payment</text>
  <text x="1095" y="530" text-anchor="middle" class="small">Stripe / MoMo</text>

  <rect x="992" y="610" width="206" height="55" rx="10" class="node node-gray"/>
  <text x="1095" y="643" text-anchor="middle" class="label">Email Service</text>

  <path class="arrow" d="M216 217 H317"/>
  <path class="arrow" d="M216 347 H260 V284 H317"/>
  <path class="arrow" d="M395 311 V380"/>
  <path class="arrow" d="M473 433 H625"/>
  <path class="arrow" d="M720 228 V257"/>
  <path class="arrow" d="M720 317 V346"/>
  <path class="arrow" d="M720 406 V435"/>
  <path class="arrow" d="M720 495 V524"/>
  <path class="arrow" d="M720 584 V613"/>

  <path class="arrow" d="M815 643 H900 V238 H992"/>
  <path class="arrow-soft" d="M815 554 H920 V379 H992"/>
  <path class="arrow-soft" d="M815 554 H932 V514 H992"/>
  <path class="arrow-soft" d="M815 554 H944 V638 H992"/>

  <path class="socket-arrow" d="M473 594 H525 V198 H625"/>
  <path class="socket-arrow" d="M317 594 H260 V548 H216"/>

  <text x="872" y="226" class="tiny">Persistent data</text>
  <text x="490" y="578" class="tiny" fill="#7c3aed">Realtime channel</text>

  <rect x="78" y="700" width="1124" height="44" rx="8" fill="#ffffff" stroke="#d8dee9"/>
  <text x="640" y="727" text-anchor="middle" class="small">
    Request flow: Browser -> React Frontend -> Express API -> Middleware -> Routes -> Controllers -> Services -> Models -> MongoDB or external services
  </text>
</svg>
